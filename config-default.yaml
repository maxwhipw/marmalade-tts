# marmalade-tts configuration
# Edit directly or use: marmalade-tts config set <key> <value>
# Full docs: see README.md or marmalade-tts --list-effects

defaults:
  engine: kitten
  device: cpu
  speed: 1.0
  play: true
  preprocessing: true    # text normalization ($100 → 100 dollars, etc.)

presets:
  fast:
    kitten: nano
    kokoro: af_heart
    piper: en_US-lessac-medium
    coqui: tts_models/en/ljspeech/tacotron2-DDC
    pocket: alba      # fast: default voice
    matcha: matcha_ljspeech
    emojivoice: paige
    api: af_heart
  balanced:
    kitten: micro
    kokoro: af_heart
    piper: en_US-lessac-medium
    coqui: tts_models/en/ljspeech/tacotron2-DDC
    pocket: fantine   # balanced: alternate voice
    matcha: matcha_ljspeech
    emojivoice: paige
    api: af_heart
  quality:
    kitten: mini
    kokoro: af_heart
    piper: en_US-lessac-medium
    coqui: tts_models/en/ljspeech/tacotron2-DDC
    pocket: cosette   # quality: another voice (pocket has no model-size variants)
    matcha: matcha_ljspeech   # matcha has no model-size variants
    emojivoice: paige
    api: af_heart

engines:
  kitten:
    device: cpu
    model_size: micro
    voice: Kiki
    daemon: true           # keep model in RAM for instant synthesis
    # preprocessing: true  # or a list of rules: [currency, number, filename]

  kokoro:
    device: cpu
    voice: af_heart
    lang: a
    daemon: false          # set true to keep kokoro model in RAM (uses ~1.4 GB)

  piper:
    device: cpu
    model: ~/.local/share/piper/voices/en_US-lessac-medium.onnx
    daemon: false
    # Expressivity knobs (config-only; same pattern as matcha steps/temperature).
    # noise_scale controls timbre variation per utterance (default 0.667 —
    # lower = more monotone but consistent, higher = more lively but variable).
    # noise_w_scale controls per-phoneme duration variation (default 0.8 —
    # lower = robotic pacing, higher = more natural cadence).
    # noise_scale: 0.667
    # noise_w_scale: 0.8

  coqui:
    device: cpu
    model: tts_models/en/ljspeech/tacotron2-DDC
    daemon: false
    # Model-specific knobs. Coqui passes these straight through to
    # TTS.tts_to_file — each model honors a different subset. See
    # docs/engine-knobs.md for the model→knob compatibility table.
    #   speaker: "p225"          # name, multi-speaker models like VITS-VCTK
    #   speaker_idx: 0           # integer alternative to `speaker`
    #   language: "en"           # IETF code, multilingual models like XTTS
    #   speaker_wav: ~/refs/me.wav  # reference WAV for XTTS voice cloning
    #   emotion: "Happy"         # Tortoise + some VITS variants

  pocket:
    device: cpu
    voice: alba
    # No daemon mode needed — Pocket TTS loads fast (~200ms)
    # Voice cloning: set voice to a .wav file path or .safetensors export

  matcha:
    device: cpu
    model: matcha_ljspeech   # or matcha_vctk (multi-speaker), or a .ckpt path
    daemon: false            # set true to keep the model in RAM (recommended)
    # Quality knobs (optional). matcha-tts is a flow-matching ODE model;
    # `steps` controls how many iterations the solver runs. Default 10 (fast,
    # what matcha-tts itself ships); 50 sounds noticeably less robotic but
    # is ~5x slower. `temperature` controls sampling stochasticity
    # (default 0.667).
    # steps: 50
    # temperature: 0.667

  emojivoice:
    device: cpu
    voice: paige             # EmojiVoice speaker checkpoint
    daemon: false            # set true to keep the model in RAM (recommended)
    # Emoji-controlled expressive TTS: an emoji in the text (🤣 😭 😡 …)
    # selects the emotional style and is stripped before synthesis.
    # Same quality knobs as matcha:
    # steps: 50
    # temperature: 0.667

  api:
    # Hosted OpenAI-compatible TTS. Defaults target Venice; any provider
    # with a /audio/speech endpoint works (OpenAI, Groq, DeepInfra, ...).
    base_url: https://api.venice.ai/api/v1
    model: tts-kokoro        # marmalade-tts api --list shows the live lineup
    voice: af_heart
    api_key_env: VENICE_API_KEY  # env var the key is read from
    # api_key: sk-...        # inline key (env var preferred)
    # timeout: 120           # seconds per request
    # extra:                 # provider-specific payload passthrough, e.g.
    #   instructions: "Speak warmly"   # (OpenAI gpt-4o-mini-tts)

# Audio effects — requires sox (apt install sox)
# Custom presets combine built-in effects. Use --list-effects to see all options.
#
# Per-engine default effects are applied whenever that engine is used,
# unless overridden on the command line with --effect.
# Set to [] to disable defaults for a specific engine.
#
# effects:
#   presets:
#     my_voice:   ["pitch=-100", "reverb=30"]
#     dramatic:   ["reverb=70", "bass=4", "echo=0.8:0.6:80:0.3"]
#   defaults:
#     kitten:   ["reverb=20"]      # subtle warmth on kitten by default
#     kokoro:   []                 # no default effects
#     piper:    []
#     coqui:    []
