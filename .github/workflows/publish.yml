name: Publish

on:
  push:
    tags:
      - 'v*'

# Default to read-only; jobs that need more raise their permissions explicitly.
permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Verify package version matches the tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(python -c "import sys; sys.path.insert(0, '.'); from marmalade_tts import __version__; print(__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but marmalade_tts.__version__ is $PKG_VERSION"
            exit 1
          fi
          echo "OK — package version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          python -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install --quiet dist/*.whl
          /tmp/test-venv/bin/marmalade-tts --version
          /tmp/test-venv/bin/python -c "import marmalade_tts; print('import OK,', marmalade_tts.__version__)"

      - name: Upload built distributions as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The "pypi" GitHub Environment must exist and be authorized in PyPI's
    # Trusted Publishers config. See PACKAGING.md.
    environment:
      name: pypi
      url: https://pypi.org/p/marmalade-tts
    permissions:
      # Required for OIDC token exchange — replaces the API token.
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI with Sigstore attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  github-release:
    name: Attach artifacts to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          # Pulls release notes from PRs/commits since the previous tag.
          # Hand-written CHANGELOG.md entries can still be added to the
          # release body afterwards via the GitHub UI.
          generate_release_notes: true
          fail_on_unmatched_files: true
