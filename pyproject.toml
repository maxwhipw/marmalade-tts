[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marmalade-tts"
version = "0.5.0"
description = "Unified local TTS CLI — kitten | kokoro | piper | coqui | pocket | matcha | emojivoice"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# uv is a hard dependency: the hands-off engine installer uses it to manage
# per-engine Python versions and venvs cross-distro. Non-pip install paths
# (install.sh, .deb/.rpm, AUR) must provide uv separately — the installer
# detects it and errors clearly if missing.
dependencies = ["pyyaml", "num2words", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
marmalade-tts = "marmalade_tts.cli:main"

[project.urls]
Homepage = "https://github.com/maxwhipw/marmalade-tts"
Repository = "https://github.com/maxwhipw/marmalade-tts"
Issues = "https://github.com/maxwhipw/marmalade-tts/issues"

[tool.hatch.build.targets.wheel]
packages = ["marmalade_tts"]

# Ship the daemon scripts inside the wheel so `pip install` / `pipx install`
# users get a working daemon mode. The marmalade_tts.daemon module resolves
# the script path via importlib.resources at runtime.
[tool.hatch.build.targets.wheel.force-include]
"daemon" = "marmalade_tts/_daemon_scripts"

# Include daemon scripts in the source distribution too.
[tool.hatch.build.targets.sdist]
include = [
    "marmalade_tts",
    "daemon",
    "systemd",
    "scripts",
    "packaging",
    "docker",
    "samples",
    "demos",
    "assets",
    "tests",
    "config-default.yaml",
    "marmalade-tts",
    "install.sh",
    "Makefile",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "INSTALL.md",
    "PACKAGING.md",
    "SPEC.md",
    "ENGINE-GUIDE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "smoke: integration tests that require installed engine binaries",
]
