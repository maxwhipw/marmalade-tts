[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marmalade-tts"
version = "0.4.0"
description = "Unified local TTS CLI — kitten | kokoro | piper | coqui | pocket"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml", "num2words"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
marmalade-tts = "marmalade_tts.cli:main"

[project.urls]
Repository = "http://george:3000/marmalade/marmalade-tts-cli"

[tool.hatch.build.targets.wheel]
packages = ["marmalade_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "smoke: integration tests that require installed engine binaries",
]
